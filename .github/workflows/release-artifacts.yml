name: Release artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to package
        required: true
        type: string
      version:
        description: Cargo package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  crate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Select the publication toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup override set 1.85.0
      - name: Fix the source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct '${{ inputs.ref }}')" >> "$GITHUB_ENV"
      - name: Create and reproduce the crate package
        run: |
          cargo package --locked
          cp "target/package/run-if-present-${{ inputs.version }}.crate" /tmp/retained.crate
          cargo package --locked
          .github/scripts/verify-same-checksum.sh \
            /tmp/retained.crate "target/package/run-if-present-${{ inputs.version }}.crate"
          mkdir crate-package
          cp /tmp/retained.crate "crate-package/run-if-present-${{ inputs.version }}.crate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crate-package
          path: crate-package
          if-no-files-found: error
          retention-days: 30

  archives:
    name: Archive ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            setup: ':'
          - runner: macos-15
            target: aarch64-apple-darwin
            setup: ':'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Select Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target "${{ matrix.target }}"
          rustup override set 1.85.0
      - name: Install target linker
        shell: bash
        run: ${{ matrix.setup }}
      - name: Build and smoke-test the executable
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          "target/${{ matrix.target }}/release/run-if-present" --version \
            | grep -Fx "run-if-present ${{ inputs.version }}"
      - name: Create the uniform archive
        run: |
          .github/scripts/make-release-archive.sh \
            "target/${{ matrix.target }}/release/run-if-present" \
            "${{ inputs.version }}" "${{ matrix.target }}" release-archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.target }}
          path: release-archive
          if-no-files-found: error
          retention-days: 30

  checksums:
    needs: archives
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archive-*
          path: release-assets
          merge-multiple: true
      - name: Create and verify SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum run-if-present-v*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 30
