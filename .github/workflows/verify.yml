name: Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  behavior:
    name: Behavior (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
        rust:
          - 1.85.0
          - stable
    steps:
      - name: Check out the immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal
          rustup override set "${{ matrix.rust }}"
      - name: Run the full behavior suite
        run: cargo test --all-targets --all-features --locked

  quality:
    name: Format, lint, and package (Rust 1.85.0)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Select Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.0
      - name: Check formatting
        run: cargo fmt --check
      - name: Reject lint warnings
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Verify package contents
        run: cargo package --locked
